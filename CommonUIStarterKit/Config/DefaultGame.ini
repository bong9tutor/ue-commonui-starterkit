; 학습 노트 (레퍼런스 §4):
;   UGameUIManagerSubsystem의 DefaultUIPolicyClass(config) 같은 게임 서브시스템 config는 이 파일에 둔다.

; ===========================================================================
; [활성] UI 정책 클래스 배선
;   UCuGameUIManagerSubsystem이 UPROPERTY(config) TSoftClassPtr<UCuGameUIPolicy>로 읽는다.
;   정책 BP(BP_StarterUIPolicy, /Game/UI/Foundation)는 세션 C에서 생성됐고 아래 경로가 그것을 가리킨다.
;   ⚠️ UPROPERTY(config) 값이라 '에디터 재시작 후에만' 다시 로드된다. 실행 중인 에디터에는 즉시 반영되지 않는다.
[/Script/CommonUIStarterKit.CuGameUIManagerSubsystem]
DefaultUIPolicyClass=/Game/UI/Foundation/BP_StarterUIPolicy.BP_StarterUIPolicy_C
; ===========================================================================

[/Script/EngineSettings.GeneralProjectSettings]
