; DefaultEngine.ini — 엔진/뷰포트/입력 라우팅 관련 정본 설정.
;
; 학습 노트 (레퍼런스 §4):
;   CommonUI/CommonInput/viewport 관련 키는 DefaultInput.ini가 아니라 '이 파일'과 DefaultGame.ini에 넣는다.

; ===========================================================================
; [치명적, 절대 누락 금지] CommonUI viewport client + Local Player Class
; ===========================================================================
[/Script/Engine.Engine]
; ▼ 없으면 UCommonUIActionRouter가 입력을 못 받아 gamepad 내비게이션·focus·Back이
;   "무음"으로 전부 죽는다(마우스만 동작해 버그 은폐). CommonUI 최다 셋업 실패 원인 (§4·§10).
GameViewportClientClassName=/Script/CommonUI.CommonGameViewportClient
; ▼ 엔진이 ULocalPlayer 대신 우리 UCuLocalPlayer를 생성하도록 지정
;   (UCuGameUIPolicy가 per-player 레이아웃 맵의 key로 삼는 아이덴티티).
LocalPlayerClassName=/Script/CommonUIStarterKit.CuLocalPlayer

; ===========================================================================
; [활성] CommonInput action DataTable/InputData 연결
;   InputData 에셋(DA_CommonInputData, UCommonUIInputData의 BP 서브클래스)은 Stage 4에서 생성됐다.
;   (레퍼런스 §4는 이 키를 DefaultEngine.ini에 두는 것을 정본으로 본다.)
;   ⚠️ startup settings라 값은 '에디터 재시작 후에만' 다시 로드된다.
[/Script/CommonInput.CommonInputSettings]
InputData=/Game/Input/DA_CommonInputData.DA_CommonInputData_C
; ===========================================================================

[/Script/EngineSettings.GameMapsSettings]
; L_StarterKit(세션 C Stage 0에서 생성)을 시작 맵으로 지정한다.
;   EditorStartupMap  = 에디터가 프로젝트를 열 때 자동으로 여는 맵 (요구사항: 스타터킷 전용 레벨이 default)
;   GameDefaultMap    = 패키징/스탠드얼론 실행 시작 맵
;   ⚠️ 둘 다 startup settings라 '에디터를 시작할 때만' 다시 로드된다. 실행 중인 에디터에는 반영되지 않는다.
; GameMode는 L_StarterKit의 World Settings(GameModeOverride=BP_StarterGameMode)로 지정(.umap 저장).
EditorStartupMap=/Game/Maps/L_StarterKit.L_StarterKit
GameDefaultMap=/Game/Maps/L_StarterKit.L_StarterKit

; --- 아래는 에디터 첫 실행이 추가한 기본값(플러그인 설정). 그대로 둔다. ---
[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
