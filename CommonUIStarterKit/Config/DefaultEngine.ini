;     gamepad 내비게이션·focus·Back이 "무음"으로 전부 죽는다(마우스만 동작해 버그 은폐).
;     CommonUI 최다 셋업 실패 원인 (레퍼런스 §4·§10).
;
; Local Player Class = /Script/CommonUIStarterKit.CommonLocalPlayer
;   ▲ UCommonLocalPlayer 클래스를 세션 B에서 작성한 뒤 여기서 지정.
;
; [/Script/CommonInput.CommonInputSettings]
; InputData=/Game/Input/DA_CommonInputData.DA_CommonInputData_C
;   ▲ UCommonUIInputData 에셋은 세션 C Stage 4에서 생성 후 연결.
